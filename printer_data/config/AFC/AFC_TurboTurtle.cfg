[include mcu/AFC_Lite.cfg]

[mcu TurboTurtle]
canbus_uuid: 4c3a5be71618
#serial: <replace with your /dev/serial/by-id/...> and comment out canbus_uuid above

[AFC_BoxTurtle TurboTurtle]
hub: TurboTurtle
extruder: extruder
enable_assist: True        # Setting to True enables espooler assist while printing
enable_kick_start: True    # Setting to True enables full speed espoolers for kick_start_time(0.070 ms default) amount
# buffer: <buffer_name> # If not defined below from the install script, uncomment and add buffer name if using a buffer
buffer: TurboTurtle

[temperature_sensor TurboTurtle]
sensor_type: temperature_mcu
sensor_mcu: TurboTurtle

[AFC_stepper lane1]
unit: TurboTurtle:1
step_pin: TurboTurtle:M1_STEP
dir_pin: !TurboTurtle:M1_DIR
enable_pin: !TurboTurtle:M1_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 130.68 
park_dist: 10
led_index: AFC_Indicator:1
afc_motor_rwd: TurboTurtle:MOT1_RWD
afc_motor_fwd: TurboTurtle:MOT1_FWD
afc_motor_enb: TurboTurtle:MOT1_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
hardware_pwm: True
prep: ^!TurboTurtle:TRG1
load: ^TurboTurtle:EXT1

[tmc2209 AFC_stepper lane1]
uart_pin: TurboTurtle:M1_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane2]
unit: TurboTurtle:2
step_pin: TurboTurtle:M2_STEP
dir_pin: !TurboTurtle:M2_DIR
enable_pin: !TurboTurtle:M2_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 69.33 
park_dist: 10
led_index: AFC_Indicator:2
afc_motor_rwd: TurboTurtle:MOT2_RWD
afc_motor_fwd: TurboTurtle:MOT2_FWD
afc_motor_enb: TurboTurtle:MOT2_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
hardware_pwm: True
prep: ^!TurboTurtle:TRG2
load: ^TurboTurtle:EXT2

[tmc2209 AFC_stepper lane2]
uart_pin: TurboTurtle:M2_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane3]
unit: TurboTurtle:3
step_pin: TurboTurtle:M3_STEP
dir_pin: !TurboTurtle:M3_DIR
enable_pin: !TurboTurtle:M3_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 90.0
park_dist: 10
led_index: AFC_Indicator:3
afc_motor_rwd: TurboTurtle:MOT3_RWD
afc_motor_fwd: TurboTurtle:MOT3_FWD
afc_motor_enb: TurboTurtle:MOT3_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
hardware_pwm: True
prep: ^!TurboTurtle:TRG3
load: ^TurboTurtle:EXT3

[tmc2209 AFC_stepper lane3]
uart_pin: TurboTurtle:M3_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane4]
unit: TurboTurtle:4
step_pin: TurboTurtle:M4_STEP
dir_pin: !TurboTurtle:M4_DIR
enable_pin: !TurboTurtle:M4_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 145.0
park_dist: 10
led_index: AFC_Indicator:4
afc_motor_rwd: TurboTurtle:MOT4_RWD
afc_motor_fwd: TurboTurtle:MOT4_FWD
afc_motor_enb: TurboTurtle:MOT4_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
hardware_pwm: True
prep: ^!TurboTurtle:TRG4
load: ^TurboTurtle:EXT4

[tmc2209 AFC_stepper lane4]
uart_pin: TurboTurtle:M4_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_hub TurboTurtle]
switch_pin: ^TurboTurtle:HUB   # Pin for the hub switch
afc_bowden_length: 1353.65  # Length of the Bowden tube from the hub to the toolhead sensor in mm.
move_dis: 75                # Distance to move the filament within the hub in mm.
#hub_clear_move_dis: 65     # Distance after hub switch becomes fast to retract to insure hub is clear
cut: False                  # Hub cutter installed (e.g. Snappy)

#--=================================================================================--#
######### Hub Cut #####################################################################
#--=================================================================================--#
assisted_retract: False     # If True, retracts are assisted to prevent loose windows on the spool
cut_cmd: AFC #CMD to use
cut_dist: 50                # How much filament to cut off (in mm).
cut_clear: 120              # How far the filament should retract back from the hub (in mm).
cut_min_length: 300.0
cut_servo_pass_angle: 10    # Servo angle to align the Bowden tube with the hole for loading the toolhead.
cut_servo_clip_angle: 180   # Servo angle for cutting the filament.
cut_servo_prep_angle: 80    # Servo angle to prepare the filament for cutting (aligning the exit hole).

#[AFC_screen TurboTurtle]
#mac_address: None

[AFC_led AFC_Indicator]
pin: TurboTurtle:RGB1
chain_count: 4
color_order: GRBW

#[neopixel Extra2]
#pin: TurboTurtle:RGB2
#chain_count: 6
#color_order: GRB

#[neopixel Extra3]
#pin: TurboTurtle:RGB3
#chain_count: 6
#color_order: GRB

#[neopixel Extra4]
#pin: TurboTurtle:RGB4
#chain_count: 4
#color_order: GRB

[AFC_buffer TurboTurtle]
advance_pin: ^TurboTurtle:TN_ADV    # set advance pin
trailing_pin: ^TurboTurtle:TN_TRL  # set trailing pin
multiplier_high: 1.05   # default 1.05, factor to feed more filament
multiplier_low:  0.95   # default 0.95, factor to feed less filament
