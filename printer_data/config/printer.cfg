[include mainsail.cfg]
[include printer_toolhead.cfg]
[include printer_macros.cfg]
[include printer_cartographer.cfg]
[include homing.cfg]

[force_move]
enable_force_move: True


#####################################################################
##                   Model and Acceleration
#####################################################################

[printer]
kinematics: corexy
max_velocity: 350
max_accel: 15000
minimum_cruise_ratio: 0.5
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 7.0


#####################################################################
##                      MCU Octopus
#####################################################################

[mcu]
canbus_uuid: 35494ee53508                # CAN bus unique identifier for Octopus MCU.
canbus_interface: can0                   # CAN bus interface.


#####################################################################
##                  Temperature Monitoring
#####################################################################

[temperature_sensor Octopus-Pro]
sensor_type: temperature_mcu             # MCU internal temperature sensor.

[temperature_sensor RPi_4]
sensor_type: temperature_host            # Host system internal temperature sensor.

#####################################################################
#                        B(X) ---------A(Y)
#                        |                |
#                        |                |
#                        |--------E-------|
#                        |                |
#                        |                |
#                        |                |
#####################################################################
##                   X-axis on MOTOR_0 (B Motor)
#####################################################################

[stepper_x]
step_pin: PF13                           		# X-axis motor pulse pin setting
dir_pin: PF12                            		# X-axis motor direction pin setting
enable_pin: !PF14                        		# X-axis motor enable pin setting
microsteps: 32                           		# Motor microsteps setting
rotation_distance: 40                    		# Active pulley circumference in mm (2GT-20T pulley 40, 2GT-16T pulley 32)
full_steps_per_rotation: 200             		# Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
endstop_pin: tmc2240_stepper_x:virtual_endstop  # Old pin before sensorless homing EBB:Something...
position_min: 0                          		# X-axis minimum travel - software limit
position_endstop: 298                    		# Mechanical reset point coordinates for X-axis
position_max: 298                        		# X-axis maximum travel - software limit
homing_speed: 20                        		# Reset speed - maximum 80
homing_retract_dist: 0                   		# Setback distance after the first trigger of the reset switch
homing_positive_dir: true                		# Direction of reset (generally no change required)

[tmc2240 stepper_x]
cs_pin: PC4                              	# Chip select pin for TMC2240 driver
spi_software_sclk_pin: PA5               	# SPI software clock pin
spi_software_mosi_pin: PA7               	# SPI software MOSI pin
spi_software_miso_pin: PA6               	# SPI software MISO pin
driver_TPFD: 0                           	# TMC2240 TPFD setting
run_current: 1.2                         	# Motor running current value (A)
interpolate: false
diag0_pin: ^!PG6
driver_SGT: 1            					#Max sensitivity -63
stealthchop_threshold: 0


#####################################################################
##                   Y-axis on MOTOR_2_1（A Motor）
#####################################################################

[stepper_y]
step_pin: PF11                           		# Y-axis motor pulse pin setting
dir_pin: PG3                            		# Y-axis motor direction pin setting
enable_pin: !PG5                         		# Y-axis motor enable pin setting
microsteps: 32                           		# Motor microsteps setting
rotation_distance: 40                    		# Active pulley circumference in mm (2GT-20T pulley 40, 2GT-16T pulley 32)
full_steps_per_rotation: 200             		# Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
endstop_pin: tmc2240_stepper_y:virtual_endstop  # Old pin before sensorless homing PG11
# endstop_pin: PG6                        		# Limit switch pin setting (Y-)
# endstop_pin: PG11                        		# Limit switch pin setting (Y-)
position_min: 0                          		# Y-axis minimum travel - software limit
position_endstop: 304                    		# Mechanical reset point coordinates for Y-axis
position_max: 304                        		# Y-axis maximum travel - software limit
homing_speed: 20                        		# Reset speed - maximum 80
homing_retract_dist: 0                   		# Setback distance after the first trigger of the reset switch
homing_positive_dir: true                		# Direction of reset (generally no change required)

[tmc2240 stepper_y]
cs_pin: PC6                              	# Chip select pin for TMC2240 driver
spi_software_sclk_pin: PA5               	# SPI software clock pin
spi_software_mosi_pin: PA7               	# SPI software MOSI pin
spi_software_miso_pin: PA6              	# SPI software MISO pin
driver_TPFD: 0                           	# TMC2240 TPFD setting
run_current: 1.2                         	# Motor running current value (A)
interpolate: false
diag0_pin: ^!PG10
driver_SGT: 1   							#Max sensitivity -63
stealthchop_threshold: 0

####################################################################################
#                          z1 -------------- z2
#                          |                 |
#                          |                 |
#                          |                 |
#                          |                 |
#                          |                 |
#                          |                 |
#                         z0---   display ---z3
#####################################################################
# 	Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left On MOTOR6
[stepper_z]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

endstop_pin: probe:z_virtual_endstop # uses cartographer as virtual endstop
homing_retract_dist: 0 # cartographer needs this to be set to 0
position_max: 280
position_min: -10

[tmc2209 stepper_z]
uart_pin: PE1
interpolate: true
run_current: 0.8
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0


##	Z1 Stepper - Rear Left on MOTOR7
[stepper_z1]
step_pin: PE6
dir_pin: !PA14
enable_pin: !PE0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PD3
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


##	Z2 Stepper - Rear Right on MOTOR4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


##	Z3 Stepper - Front Right on MOTOR5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: true
run_current: 0.8
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
##	SSR Pin - BED_OUT
heater_pin: PA3
sensor_type: Generic 3950
sensor_pin: PF3
##	Adjust Max Power so your heater doesn't warp your bed
max_power: 0.8
min_temp: 0
max_temp: 120
control: pid
pid_kp: 41.677
pid_ki: 2.105
pid_kd: 206.303

[idle_timeout]
timeout: 1800


#####################################################################
# 	Fan Control
#####################################################################

[multi_pin my_controller_fan_pins]
pins: PE5, PD12

[controller_fan controller_fan]
pin: multi_pin:my_controller_fan_pins
shutdown_speed: 0.0
kick_start_time: 0.5 
fan_speed: 0.5

# moved to printer_toolhead.cfg
# [fan_generic exhaust_fan]
# #	Exhaust fan - CNC_FAN3
# pin: PD13
# max_power: 1.0
# shutdown_speed: 0.0
# kick_start_time: 5.0

[output_pin BedFans]
pin: PA8
value: 0
shutdown_value: 0


#####################################################################
# 	LED Control
#####################################################################

[output_pin DaylightSticks]
pin: PB11
pwm: True
cycle_time: 0.01


#####################################################################
# 	Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

[quad_gantry_level]
##	Use QUAD_GANTRY_LEVEL to level a gantry.
##	Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
gantry_corners:
	-60,-10
	360,370

#	Probe points
points:
	25,10
	25,260
	280,260
	280,10

#--------------------------------------------------------------------
speed: 200
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.0075
max_adjust: 10

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 59.6
shaper_type_y: mzv
shaper_freq_y: 43.2

[exclude_object]

